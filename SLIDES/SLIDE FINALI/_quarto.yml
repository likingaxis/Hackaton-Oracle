project:
  type: default
  render:
    - slides.qmd

lang: it
format:
  revealjs:
    theme: [default, theme.scss, finali.scss]
    css: fonts.css
    width: 1600
    height: 900
    margin: 0
    center: false
    transition: fade
    transition-speed: default
    background-transition: fade
    controls: false
    progress: false
    slide-number: c/t
    show-slide-number: all
    hash: true
    history: false
    overview: true
    touch: true
    navigation-mode: linear
    keyboard: true
    menu: false
    help: false
    slide-level: 2
    title-slide: false
    embed-resources: true
    html-math-method: mathml
    pdf-separate-fragments: false
    pdf-max-pages-per-slide: 1
    footer: "TEAM STRUFFOLI"
    highlight-style: github
    code-copy: false
    code-line-numbers: false
    code-overflow: wrap
    output-file: AI_Race_Engineer_Copilot.html
